                testCasesBn: "<strong>ইনপুট 1:</strong> 011<br>• s-এ 0 আছে 1টি, 1 আছে 2টি।<br>• t বানানোর সময় আমরা চাই '0' এর জায়গায় '1' বসাতে আর '1' এর জায়গায় '0'।<br>• ১ম পজিশনে '0' -> বদলে '1' বসাতে পারব (1 এর স্টক আছে)।<br>• ২য় পজিশনে '1' -> বদলে '0' বসাতে পারব (0 এর স্টক আছে)।<br>• ৩য় পজিশনে '1' -> বদলাতে '0' দরকার, কিন্তু '0' এর স্টক শেষ।<br>• সুতরাং t এর দৈর্ঘ্য হবে 2 (যেমন '10')। উত্তর = 3 - 2 = 1 ডিলিট।",
                hintsBn: "1. স্ট্রিং-এ মোট '0' এবং '1' এর সংখ্যা গুনে নিন (Frequency Count)।<br>2. t এর প্রতিটা পজিশনে s[i] এর বিপরীত ক্যারেক্টারটি বসানোর চেষ্টা করুন।<br>3. s[i] == '0' হলে আপনার 1 টি '1' লাগবে, s[i] == '1' হলে 1 টি '0' লাগবে।<br>4. যখনই বিপরীত ক্যারেক্টারটির কাউন্ট 0 হয়ে যাবে, তার মানে এর পর আর কোনো ক্যারেক্টার ম্যাচ করানো সম্ভব নয়।<br>5. মোট দৈর্ঘ্যের বাকি অংশটিই ডিলিট করতে হবে।",

#include <string>
#include <vector>
using namespace std;

void solve() {
    string s;
    cin >> s;
    
    // CP Cheat Sheet Page 2: Frequency Count Concept
    int cnt[2] = {0};
    for (char c : s) {
        cnt[c - '0']++;
    }
    
    int matched = 0;
    for (char c : s) {
        int need = (c == '0') ? 1 : 0; // '0' এর বিপরীতে '1' দরকার, '1' এর বিপরীতে '0'
        if (cnt[need] > 0) {
            cnt[need]--;
            matched++;
        } else {
            break; // স্টক শেষ, আর মেলানো সম্ভব নয়
        }
    }
    
    // ডিলিট করতে হবে = মোট দৈর্ঘ্য - মোট ম্যাচড দৈর্ঘ্য
    cout << s.length() - matched << "\n";
}

int main() {
    ios_base::sync_with_stdio(false);
    cin.tie(NULL);
    int t;
    cin >> t;
    while (t--) solve();
    return 0;
}`

                timeComplexity: "O(N)",

                codeCpp: `#include <iostream>
#include <vector>
#include <algorithm>
using namespace std;

void solve() {
    int n, k;
    cin >> n >> k;
    vector<int> a(n);
    int even_cnt = 0;
    int min_ops = k;

    for (int i = 0; i < n; i++) {
        cin >> a[i];
        if (a[i] % 2 == 0) even_cnt++;
        
        int rem = a[i] % k;
        int needed = (rem == 0) ? 0 : (k - rem);
        min_ops = min(min_ops, needed);
    }

    if (k == 4) {
        // Option B for k=4: make 2 even numbers
        int ops_for_two_evens = max(0, 2 - even_cnt);
        min_ops = min(min_ops, ops_for_two_evens);
    }

    cout << min_ops << "\n";
}

int main() {
    ios_base::sync_with_stdio(false);
    cin.tie(NULL);
    int t; cin >> t;
    while(t--) solve();
    return 0;
}`

                        ${p.topics.map(t => `<span class="bg-indigo-50 text-brand-700 text-xs font-medium px-2.5 py-0.5 rounded-full border border-indigo-100"># ${t}</span>`).join('')}
                    </div>
                </div>

                <!-- Section 1: CP Cheat Sheet Direct Citation Box -->
                <div class="bg-gradient-to-r from-indigo-50 to-emerald-50 border-l-4 border-brand-600 rounded-r-2xl p-5 mb-8 shadow-sm">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center space-x-2 text-brand-700 font-bold text-sm">
                            <i class="fa-solid fa-book-bookmark"></i>
                            <span>CP CHEAT SHEET Reference Reference</span>
                        </div>
                        <span class="bg-brand-600 text-white font-bold text-xs px-2.5 py-1 rounded-md shadow-sm">
                            ${p.pdfPage}
                        </span>
                    </div>
                    <div class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">${p.pdfSection}</div>
                    <p class="bengali-text text-slate-700 mb-3">
                        এই সমস্যাটি সমাধান করতে আমাদের <strong>CP Cheat Sheet</strong> এর <strong>${p.pdfPage}</strong> পেজের নিচের কোড স্নিপেট বা কনসেপ্টটি ব্যবহার করতে হবে:
                    </p>
                    <div class="bg-slate-900 text-slate-100 rounded-xl p-3.5 code-font text-xs sm:text-sm overflow-x-auto shadow-inner border border-slate-800">
                        <pre><code>${escapeHtml(p.pdfCodeSnippet)}</code></pre>
                    </div>
                </div>

                <!-- Section 2: Problem Summary (বাংলায়) -->
                <div class="mb-8">
                    <h3 class="text-lg font-bold text-slate-900 flex items-center space-x-2 mb-3 border-b border-slate-100 pb-2">
                        <i class="fa-solid fa-file-lines text-brand-600"></i>
                        <span>১. সমস্যা পরিচিতি (Problem Statement in Bengali)</span>
                    </h3>
                    <div class="bengali-text bg-slate-50 border border-slate-200 rounded-xl p-4 text-slate-800 leading-relaxed">
                        ${p.summaryBn}
                    </div>
                </div>

                <!-- Section 3: Test Cases (বাংলায় বিশ্লেষণ) -->
                <div class="mb-8">
                    <h3 class="text-lg font-bold text-slate-900 flex items-center space-x-2 mb-3 border-b border-slate-100 pb-2">
                        <i class="fa-solid fa-flask text-emerald-600"></i>
                        <span>২. টেস্ট কেস বিশ্লেষণ (Test Case Walkthrough)</span>
                    </h3>
                    <div class="bengali-text bg-emerald-50/50 border border-emerald-200 rounded-xl p-4 text-slate-800 leading-relaxed">
                        ${p.testCasesBn}
                    </div>
                </div>

                <!-- Section 4: Solution Logic & Hints (বাংলায়) -->
                <div class="mb-8">
                    <h3 class="text-lg font-bold text-slate-900 flex items-center space-x-2 mb-3 border-b border-slate-100 pb-2">
                        <i class="fa-solid fa-lightbulb text-amber-500"></i>
                        <span>৩. থিংকিং প্রসেস ও অ্যালগরিদম (Core Strategy & Logic)</span>
                    </h3>
                    <div class="bengali-text bg-amber-50/40 border border-amber-200 rounded-xl p-4 text-slate-800 leading-relaxed space-y-2">
                        ${p.hintsBn}
                    </div>
                    <!-- Complexity Badges -->
                    <div class="flex items-center space-x-4 mt-3 px-1">
                        <span class="text-xs font-semibold text-slate-500">Time Complexity: <strong class="text-slate-800 code-font">${p.timeComplexity}</strong></span>
                        <span class="text-xs font-semibold text-slate-500">Space Complexity: <strong class="text-slate-800 code-font">${p.spaceComplexity}</strong></span>
                    </div>
                </div>

                <!-- Section 5: C++ Reference Solution with Bengali Comments -->
                <div class="mb-6">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-2">
                        <h3 class="text-lg font-bold text-slate-900 flex items-center space-x-2">
                            <i class="fa-solid fa-code text-indigo-600"></i>
                            <span>৪. সম্পূর্ণ C++ সমাধান (Complete Solved Code)</span>
                        </h3>
                        <button onclick="copyCode()" class="flex items-center space-x-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition-colors">
                            <i class="fa-regular fa-copy"></i>
                            <span>Copy Code</span>
                        </button>
                    </div>

                    <div class="relative bg-slate-900 rounded-xl overflow-hidden shadow-md border border-slate-800">
                        <div class="bg-slate-800/80 px-4 py-2 flex items-center justify-between text-xs text-slate-400 code-font">
                            <span>solution.cpp</span>
                            <span>C++17</span>
                        </div>
                        <pre class="p-4 code-font text-xs sm:text-sm text-slate-100 overflow-x-auto leading-relaxed"><code id="codeBlock">${escapeHtml(p.codeCpp)}</code></pre>
                    </div>
                </div>
            `;
            renderMathIn(view);
        }

        // Render $...$ math (KaTeX) inside the problem view
        function renderMathIn(el) {
            if (typeof renderMathInElement !== 'function') {
                setTimeout(() => renderMathIn(el), 200);
                return;
            }
            renderMathInElement(el, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Copy Code Function
        function copyCode() {
            const codeText = document.getElementById('codeBlock').innerText;
            const textarea = document.createElement('textarea');
            textarea.value = codeText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast("কোড সফলভাবে কপি করা হয়েছে!");
        }

        // Toast Handler
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
